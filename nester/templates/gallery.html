{% extends "base.html" %}
{% block title %}Gallery — Nester{% endblock %}
{% block head %}
<style>
  .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
  .gallery-item { aspect-ratio: 4/3; overflow: hidden; border-radius: 1rem; cursor: pointer; border: 1px solid #1e1e2e; }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
  .gallery-item:hover img { transform: scale(1.05); }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: none; align-items: center; justify-content: center; }
  .lightbox.active { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 85vh; object-fit: contain; border-radius: 0.5rem; }
  .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(168,85,247,0.3); border: none; color: white; font-size: 2rem; padding: 0.5rem 1rem; cursor: pointer; border-radius: 0.5rem; }
  .lightbox-nav.prev { left: 1rem; }
  .lightbox-nav.next { right: 1rem; }
  .lightbox-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: white; font-size: 2rem; cursor: pointer; }
</style>
{% endblock %}
{% block content %}
<section class="max-w-6xl mx-auto px-4 py-16">
  <h1 class="text-3xl font-bold mb-2">Gallery</h1>
  <p class="text-zinc-400 mb-10">Real photos of the house — rooms, kitchen, living area and garden.</p>
  <div class="gallery-grid" id="gallery">
    {% for img in images %}
    <div class="gallery-item" onclick="openLightbox({{ loop.index0 }})">
      <img src="/static/images/{{ img }}" alt="House photo {{ loop.index }}" loading="lazy">
    </div>
    {% else %}
    <p class="text-zinc-500">Photos will appear here.</p>
    {% endfor %}
  </div>
</section>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">×</button>
  <button class="lightbox-nav prev" onclick="navLightbox(-1)">‹</button>
  <img id="lightbox-img" src="" alt="Full view">
  <button class="lightbox-nav next" onclick="navLightbox(1)">›</button>
</div>

<script>
  const images = {{ images | tojson }};
  let current = 0;
  function openLightbox(i) {
    current = i;
    document.getElementById('lightbox-img').src = '/static/images/' + images[i];
    document.getElementById('lightbox').classList.add('active');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
  }
  function navLightbox(dir) {
    current = (current + dir + images.length) % images.length;
    document.getElementById('lightbox-img').src = '/static/images/' + images[current];
  }
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') navLightbox(-1);
    if (e.key === 'ArrowRight') navLightbox(1);
  });
</script>
{% endblock %}
