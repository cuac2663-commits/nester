{% extends "base.html" %}
{% block title %}Property — Admin{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-10">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">Property settings</h1>
    <a href="/admin/dashboard" class="text-sm text-zinc-400 hover:text-purple-300">← Dashboard</a>
  </div>
  <form method="POST" class="card p-6 space-y-5">
    <div>
      <label class="block text-sm text-zinc-400 mb-1">Address</label>
      <input type="text" name="address" value="{{ prop.address }}" class="w-full bg-[#0a0a0f] border border-[#1e1e2e] rounded-xl px-4 py-3">
    </div>
    <div>
      <label class="block text-sm text-zinc-400 mb-1">Available from</label>
      <input type="text" name="available_from" value="{{ prop.available_from }}" class="w-full bg-[#0a0a0f] border border-[#1e1e2e] rounded-xl px-4 py-3">
    </div>
    <div class="grid grid-cols-3 gap-4">
      <div>
        <label class="block text-sm text-zinc-400 mb-1">Rooms</label>
        <input type="number" name="rooms" value="{{ prop.rooms }}" class="w-full bg-[#0a0a0f] border border-[#1e1e2e] rounded-xl px-4 py-3">
      </div>
      <div>
        <label class="block text-sm text-zinc-400 mb-1">People</label>
        <input type="number" name="people" value="{{ prop.people }}" class="w-full bg-[#0a0a0f] border border-[#1e1e2e] rounded-xl px-4 py-3">
      </div>
      <div>
        <label class="block text-sm text-zinc-400 mb-1">Price / room</label>
        <input type="number" name="price_per_room" value="{{ prop.price_per_room }}" class="w-full bg-[#0a0a0f] border border-[#1e1e2e] rounded-xl px-4 py-3">
      </div>
    </div>
    <div>
      <label class="block text-sm text-zinc-400 mb-1">Description</label>
      <textarea name="description" rows="4" class="w-full bg-[#0a0a0f] border border-[#1e1e2e] rounded-xl px-4 py-3">{{ prop.description }}</textarea>
    </div>
    <button type="submit" class="btn-primary text-white font-semibold px-6 py-3 rounded-full">Save changes</button>
  </form>
</div>
{% endblock %}
