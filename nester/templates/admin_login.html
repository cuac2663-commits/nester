<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Nester</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{background:#0a0a0f;color:#f4f4f5}</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="w-12 h-12 mx-auto mb-4 rounded-xl bg-gradient-to-br from-purple-500 to-violet-700 flex items-center justify-center text-white font-bold">N</div>
      <h1 class="text-2xl font-bold">Admin access</h1>
      <p class="text-zinc-500 text-sm mt-1">Enter the site password</p>
    </div>
    {% if error %}
    <div class="mb-4 p-3 rounded-lg bg-red-900/40 text-red-200 text-sm text-center">{{ error }}</div>
    {% endif %}
    <form method="POST" class="space-y-4">
      <input type="password" name="password" required autofocus placeholder="Password"
        class="w-full bg-[#12121a] border border-[#1e1e2e] rounded-xl px-4 py-3 focus:outline-none focus:border-purple-500">
      <button type="submit" class="w-full py-3 rounded-xl font-semibold text-white"
        style="background:linear-gradient(135deg,#a855f7,#7c3aed)">Sign in</button>
    </form>
    <p class="text-center mt-6"><a href="/" class="text-zinc-500 text-sm hover:text-purple-400">← Back to site</a></p>
  </div>
</body>
</html>
